<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - JOL-Bilim</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                const userRaw = localStorage.getItem('jolBilimUser');
                if (!userRaw) {
                    window.location.href = 'cabinet.html';
                    return;
                }
                const user = JSON.parse(userRaw);
                if (!user || !user.name) {
                    window.location.href = 'cabinet.html';
                }
            } catch(e) {
                window.location.href = 'cabinet.html';
            }
        })();
    </script>
    <style>
        :root {
            --bg: #000000;
            --ink: #F3F1E9;
            --ink-soft: rgba(243,241,233,0.65);
            --accent: #E3A83B;
            --line: rgba(255,255,255,0.12);
            --white: #ffffff;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--bg);
            min-height: 100vh;
        }

        .liquid-glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line);
        }

        .empty-state {
            background: rgba(255,255,255,0.02);
            border: 1px dashed var(--line);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        .history-card-container {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
        }

        .history-list { 
            list-style: none; 
            display: flex; 
            flex-direction: column; 
        }

        .history-item {
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink-soft);
        }

        .subject-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .history-item .date { 
            color: var(--ink-soft); 
        }

        .history-item .separator {
            color: var(--ink-soft);
            opacity: 0.6;
        }

        .history-item .subject-name {
            color: var(--ink);
            font-weight: 500;
        }

        .history-item .item-score { 
            font-size: 14px; 
            font-weight: 600; 
        }

        .show-more-history-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: none;
            border: none;
            border-top: 1px solid var(--line);
            color: var(--accent);
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            transition: opacity 0.2s ease;
            font-family: inherit;
        }

        .show-more-history-btn:hover {
            opacity: 0.8;
        }

        .score-placeholder {
            font-size: 1rem;
            color: var(--ink-soft);
        }

        .score {
            font-family: 'Instrument Serif', serif;
            font-size: 40px;
            color: var(--accent);
            line-height: 1;
        }

        @media (max-width: 760px) {
            div[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
            }
            .left-panel {
                padding: 32px !important;
            }
            .right-panel-content {
                position: relative !important;
                height: auto !important;
                padding: 32px !important;
            }
        }
    </style>
    <script src="js/video-lazy.js" defer></script>
</head>
<body>
<video autoplay muted loop playsinline preload="none" poster="videos/dashboard-bg-poster.webp" style="position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">
  <source data-src="videos/dashboard-bg-small.mp4" type="video/mp4">
</video>
<div style="position:fixed; inset:0; background:linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); z-index:1; pointer-events:none;"></div>

<div style="display:grid; grid-template-columns:1fr 1.3fr; min-height:100vh; position:relative; z-index:2;">

  <!-- левая панель -->
  <div class="left-panel liquid-glass" style="border-right:1px solid var(--line); padding:60px; display:flex; flex-direction:column; justify-content:space-between; z-index:2;">
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:60px;">
        <a href="index.html" style="text-decoration:none; color:inherit;"><div style="font-weight:600; font-size:16px;">JOL-<span style="color:var(--accent);">Bilim</span></div></a>
        <a href="#" id="btn-logout" style="color:var(--ink-soft); font-size:13px; text-decoration:none;">Выйти</a>
      </div>
      <h1 id="user-greeting" style="font-family:'Instrument Serif',serif; font-weight:400; font-size:44px; margin:0 0 12px;">
        Привет, ...!
      </h1>
      <div id="user-grade" style="display:inline-block; background:rgba(255,255,255,0.06); 
        border:1px solid var(--line); border-radius:100px; padding:6px 16px; font-size:13px; color:var(--ink-soft);"></div>
    </div>

    <!-- блок кода для родителя внизу, как цитата в референсе -->
    <div style="border-top:1px solid var(--line); padding-top:24px;">
      <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px;">код для родителя</div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
        <div id="parent-code" style="font-family:'IBM Plex Mono',monospace; font-size:28px; color:var(--accent);">------</div>
        <button id="btn-copy" class="liquid-glass" style="padding:10px 18px; border-radius:100px; color:#fff; font-size:13px; border:1px solid var(--line); cursor:pointer;">Скопировать</button>
      </div>
    </div>
  </div>

  <!-- правая часть: плавающие карточки -->
  <div class="right-panel-content" style="position:relative; z-index:2; padding:40px; height:100vh; overflow-y:auto; display:flex; flex-direction:column; justify-content:space-between;">
    
    <!-- верхняя карточка: прогноз балла -->
    <div class="liquid-glass" style="border-radius:20px; padding:24px; max-width:300px;">
      <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">прогноз балла ОРТ</div>
      <div id="score-display"></div>
      <div style="font-size:13px; color:var(--ink-soft); margin-top:6px;">Пройдено тестов: <span id="tests-count" class="mono">0</span></div>
    </div>

    <!-- нижний ряд: начать тест + история -->
    <div style="display:flex; flex-direction:column; gap:16px;">
      <a href="test.html" class="liquid-glass" style="border-radius:20px; padding:24px; text-decoration:none; color:#fff; display:flex; align-items:center; justify-content:space-between;">
        <span style="font-family:'Instrument Serif',serif; font-size:22px;">Начать тест</span>
        <span style="font-size:20px;">→</span>
      </a>
      <div class="liquid-glass" style="border-radius:20px; padding:24px;">
        <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:14px;">история тестирования</div>
        <div id="history-container"></div>
      </div>
    </div>

  </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const userRaw = localStorage.getItem('jolBilimUser');
        if (!userRaw) {
            window.location.href = 'cabinet.html';
            return;
        }

        let user;
        try {
            user = JSON.parse(userRaw);
        } catch(e) {
            window.location.href = 'cabinet.html';
            return;
        }

        // Заполнение данных пользователя
        document.getElementById('user-greeting').textContent = `Привет, ${user.name || 'ученик'}!`;
        document.getElementById('user-grade').textContent = user.grade || 'Ученик';
        document.getElementById('tests-count').textContent = user.testsCompleted || 0;

        // Отображение семейного кода
        let familyCode = user.familyCode;
        if (!familyCode) {
            function generateFamilyCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = '';
                for (let i = 0; i < 6; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }
            familyCode = generateFamilyCode();
            user.familyCode = familyCode;
            localStorage.setItem('jolBilimUser', JSON.stringify(user));

            // Сохраняем в Firestore для совместимости со старыми аккаунтами
            db.collection('families').doc(familyCode).set({
                name: user.name || 'Ученик',
                grade: user.grade || '11 класс',
                contact: user.contact || '',
                score: user.score || 0,
                testsCompleted: user.testsCompleted || 0,
                history: user.history || []
            }).catch(err => console.error("Error retroactively creating family doc: ", err));
        }

        const parentCodeEl = document.getElementById('parent-code');
        if (parentCodeEl) {
            parentCodeEl.textContent = familyCode;
        }

        const btnCopy = document.getElementById('btn-copy');
        if (btnCopy) {
            btnCopy.addEventListener('click', () => {
                navigator.clipboard.writeText(familyCode)
                    .then(() => {
                        const originalText = btnCopy.textContent;
                        btnCopy.textContent = 'Скопировано ✓';
                        btnCopy.style.backgroundColor = 'var(--accent)';
                        btnCopy.style.color = '#000';
                        setTimeout(() => {
                            btnCopy.textContent = originalText;
                            btnCopy.style.backgroundColor = '';
                            btnCopy.style.color = '';
                        }, 1000);
                    })
                    .catch(err => {
                        console.error('Ошибка копирования: ', err);
                    });
            });
        }

        // Выйти
        document.getElementById('btn-logout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('jolBilimUser');
            window.location.href = 'cabinet.html';
        });

        // Отображение прогноза балла
        const scoreDisplay = document.getElementById('score-display');
        const score = user.score || 0;
        if (score === 0 || !user.testsCompleted) {
            scoreDisplay.className = 'score-placeholder';
            scoreDisplay.textContent = 'Пройди первый тест, чтобы увидеть прогноз';
        } else {
            scoreDisplay.className = 'score mono';
            scoreDisplay.textContent = score;
        }

        // История тестов
        const historyContainer = document.getElementById('history-container');
        const history = user.history || [];

        function getSubjectDisplayName(subj) {
            if (!subj) return 'Тест';
            const map = {
                'math': 'Математика',
                'reading': 'Грамотность чтения',
                'analogies': 'Аналогии',
                'geometry': 'Геометрия',
                'kyrgyz': 'Кыргызский язык',
                'english': 'Английский язык',
                'physics': 'Физика'
            };
            return map[subj] || subj;
        }
        function getSubjectDotColor(subjectName) {
            const colors = ['var(--accent)', '#3b82f6', '#10b981', '#8b5cf6', '#f59e0b'];
            let hash = 0;
            if (subjectName) {
                for (let i = 0; i < subjectName.length; i++) {
                    hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
                }
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getPreviousScoreForSubject(historyArr, currentIndex, subjectName) {
            for (let j = currentIndex + 1; j < historyArr.length; j++) {
                const prevSubj = getSubjectDisplayName(historyArr[j].subject);
                if (prevSubj === subjectName) {
                    return historyArr[j].score;
                }
            }
            return null;
        }

        if (history.length === 0 || !user.testsCompleted) {
            historyContainer.innerHTML = '<div class="empty-state">Тестов пока нет — начни первый прямо сейчас</div>';
        } else {
            const cardContainer = document.createElement('div');
            cardContainer.className = 'history-card-container';

            const ul = document.createElement('ul');
            ul.className = 'history-list';

            function renderItems(limit) {
                ul.innerHTML = '';
                const itemsToRender = history.slice(0, limit);

                itemsToRender.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'history-item';

                    const dateText = item.date || `Попытка #${index + 1}`;
                    const subjectName = getSubjectDisplayName(item.subject);
                    const scoreVal = item.score !== undefined ? item.score : 0;

                    const prevScore = getPreviousScoreForSubject(history, index, subjectName);
                    let scoreStyle = 'color: var(--accent);';
                    if (prevScore !== null && scoreVal > prevScore) {
                        scoreStyle = 'color: #34d399;';
                    }

                    const dotColor = getSubjectDotColor(subjectName);

                    li.innerHTML = `
                        <div class="history-item-left">
                            <span class="subject-dot" style="background-color: ${dotColor};"></span>
                            <span class="date">${dateText}</span>
                            <span class="separator">·</span>
                            <span class="subject-name">${subjectName}</span>
                        </div>
                        <span class="item-score mono" style="${scoreStyle}">${scoreVal}</span>
                    `;
                    ul.appendChild(li);
                });
            }

            renderItems(5);
            cardContainer.appendChild(ul);

            if (history.length > 5) {
                const showMoreBtn = document.createElement('button');
                showMoreBtn.className = 'show-more-history-btn';
                showMoreBtn.innerHTML = 'Показать всю историю →';

                let expanded = false;
                showMoreBtn.addEventListener('click', () => {
                    expanded = !expanded;
                    if (expanded) {
                        renderItems(history.length);
                        showMoreBtn.innerHTML = 'Скрыть историю ↑';
                    } else {
                        renderItems(5);
                        showMoreBtn.innerHTML = 'Показать всю историю →';
                    }
                });

                cardContainer.appendChild(showMoreBtn);
            }

            historyContainer.appendChild(cardContainer);
        }
    });
</script>
