<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет родителя - JOL-Bilim</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000000; --ink: #F3F1E9; --ink-soft: rgba(243,241,233,0.65); --accent: #E3A83B; --line: rgba(255,255,255,0.12); --white: #ffffff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow-x: hidden; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.liquid-glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); }
#submit-code:hover { transform: translateY(-2px); }
.flash { opacity: 0.2; }
.progress-card { display: none; position: relative; z-index: 2; width: 100%; max-width: 520px; margin: auto; border-radius: 24px; padding: 36px; background: rgba(0,0,0,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.history-list { list-style: none; display: flex; flex-direction: column; max-height: 240px; overflow-y: auto; margin-top: 12px; }
.history-item { padding: 12px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.history-item:first-child { border-top: none; }
.history-item .date { color: var(--ink-soft); }
.history-item .score-val { font-weight: 600; color: var(--accent); }
@media (max-width:480px) {
  .code-search-bar {
    flex-direction: column;
    align-items: stretch;
    border-radius: 20px;
    padding: 16px;
    gap: 10px;
  }
  #code-input {
    padding: 10px 4px;
  }
  #submit-code {
    width: 100%;
    justify-content: center;
    border-radius: 100px;
  }
}
</style>
    <script src="js/video-lazy.js" defer></script>
</head>
<body>
<video autoplay muted loop playsinline preload="none" poster="videos/parent-bg-poster.webp" style="position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">
  <source data-src="videos/parent-bg-small.mp4" type="video/mp4">
</video>
<div style="position:fixed; inset:0; z-index:1; background:linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.85) 100%);"></div>

<a href="index.html" style="position:fixed; top:24px; left:24px; z-index:10; text-decoration:none; color:#fff; font-weight:600; font-size:16px;">JOL-<span style="color:var(--accent);">Bilim</span></a>

<div id="form-card" style="position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px;">
  <div style="font-size:12px; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:20px;">кабинет родителя</div>
  <h1 style="font-family:'Instrument Serif',serif; font-weight:400; font-size:56px; line-height:1.1; margin:0 0 16px; color:#fff;">
    Прогресс вашего <em style="font-style:italic; color:var(--accent);">ребёнка</em>
  </h1>
  <p style="font-size:15px; color:var(--ink-soft); margin:0 0 32px;">Введите код, который прислал вам ребёнок</p>

  <form id="code-form" style="width:100%; display:flex; flex-direction:column; align-items:center;" novalidate>
    <div id="group-code" style="width:100%; max-width:420px; margin:0 auto;">
      <div class="liquid-glass code-search-bar" style="display:flex; align-items:center; gap:8px; border-radius:100px; padding:6px 6px 6px 24px;">
        <input type="text" id="code-input" placeholder="Например: A1B2C3" style="flex:1; background:none; border:none; color:#fff; font-size:14px; outline:none; text-transform:uppercase;">
        <button type="submit" id="submit-code" style="background:#fff; color:#000; border:none; border-radius:100px; padding:12px 24px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; transition:transform 0.2s ease;">Показать прогресс →</button>
      </div>
      <div id="code-error" style="color:#F87171; font-size:13px; margin-top:14px; display:none;"></div>
    </div>
  </form>
</div>

<div class="progress-card" id="progress-card">
  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:16px;">
    <div>
      <div style="font-family:'Instrument Serif',serif; font-size:32px; color:#fff; margin-bottom:4px;" id="child-name">Имя ребёнка</div>
      <div style="font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:0.08em;" id="child-grade">Класс</div>
    </div>
    <button id="btn-change-code" style="background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline;">← Другой код</button>
  </div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
    <div class="liquid-glass" style="border-radius:16px; padding:20px;">
      <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">прогноз балла ОРТ</div>
      <div class="mono" style="font-family:'Instrument Serif',serif; font-size:42px; color:var(--accent); line-height:1; transition: opacity 0.4s ease;" id="child-score">0</div>
    </div>
    <div class="liquid-glass" style="border-radius:16px; padding:20px;">
      <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">пройдено тестов</div>
      <div class="mono" style="font-family:'Instrument Serif',serif; font-size:42px; color:#fff; line-height:1; transition: opacity 0.4s ease;" id="child-tests">0</div>
    </div>
  </div>
  <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:12px;">история тестирования</div>
  <div id="child-history">
    <div style="color:var(--ink-soft); background:rgba(255,255,255,0.02); padding:16px; border-radius:12px; text-align:center; font-size:13px;">Тестов пока не было</div>
  </div>
  <div style="margin-top:24px; text-align:center;">
    <a href="#" id="link-change-code" style="color:var(--ink-soft); font-size:12px; text-decoration:underline;">Ввести другой код</a>
  </div>
</div>

<div class="liquid-glass" style="position:relative; z-index:2; margin:0 24px 24px; border-radius:20px; padding:20px 24px; text-align:center; font-size:12px; color:var(--ink-soft);">
  JOL-Bilim · подготовка к ОРТ с помощью ИИ
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAmru1-7SS3dwAMEborymtJJudtcflQYzU",
  authDomain: "jol-bilim.firebaseapp.com",
  projectId: "jol-bilim",
  storageBucket: "jol-bilim.firebasestorage.app",
  messagingSenderId: "1059233182996",
  appId: "1:1059233182996:web:40ad78360b42dd49d37e01",
  measurementId: "G-P7RR3W3ZF7"
});
const db = firebase.firestore();
document.addEventListener('DOMContentLoaded', () => {
    const formCard = document.getElementById('form-card');
    const progressCard = document.getElementById('progress-card');
    const codeForm = document.getElementById('code-form');
    const groupCode = document.getElementById('group-code');
    const inputCode = document.getElementById('code-input');
    const errorText = document.getElementById('code-error');
    const childNameEl = document.getElementById('child-name');
    const childGradeEl = document.getElementById('child-grade');
    const childScoreEl = document.getElementById('child-score');
    const childTestsEl = document.getElementById('child-tests');
    const childHistoryEl = document.getElementById('child-history');
    const btnChangeCode = document.getElementById('btn-change-code');
    const linkChangeCode = document.getElementById('link-change-code');
    let unsubscribe = null, prevScore = null, prevTests = null;

    inputCode.addEventListener('input', () => {
        groupCode.classList.remove('has-error');
        errorText.style.display = 'none';
        inputCode.value = inputCode.value.toUpperCase();
    });

    function searchProgress(targetCode) {
        const code = (targetCode || inputCode.value).trim().toUpperCase();
        if (!code) {
            groupCode.classList.add('has-error');
            errorText.style.display = 'block';
            errorText.textContent = 'Введите семейный код';
            return;
        }
        inputCode.value = code;
        if (unsubscribe) unsubscribe();

        unsubscribe = db.collection('families').doc(code).onSnapshot((doc) => {
            if (!doc.exists) {
                localStorage.removeItem('jolBilimParentCode');
                groupCode.classList.add('has-error');
                errorText.style.display = 'block';
                errorText.textContent = 'Код не найден, проверьте правильность';
                formCard.style.display = 'flex';
                progressCard.style.display = 'none';
                return;
            }
            groupCode.classList.remove('has-error');
            errorText.style.display = 'none';
            formCard.style.display = 'none';
            progressCard.style.display = 'block';

            // Сохраняем код при успешном нахождении
            localStorage.setItem('jolBilimParentCode', code);

            const data = doc.data();
            childNameEl.textContent = data.name || 'Ученик';
            childGradeEl.textContent = data.grade || 'Класс';

            const newScore = data.score ?? 0;
            const newTests = data.testsCompleted ?? 0;

            if (prevScore !== null && (prevScore !== newScore || prevTests !== newTests)) {
                childScoreEl.classList.add('flash');
                childTestsEl.classList.add('flash');
                setTimeout(() => {
                    childScoreEl.classList.remove('flash');
                    childTestsEl.classList.remove('flash');
                }, 400);
            }
            prevScore = newScore;
            prevTests = newTests;

            childScoreEl.textContent = newScore;
            childTestsEl.textContent = newTests;

            const history = data.history || [];
            if (history.length === 0) {
                childHistoryEl.innerHTML = '<div style="color:var(--ink-soft); background:rgba(255,255,255,0.02); padding:16px; border-radius:12px; text-align:center; font-size:13px;">Тестов пока не было</div>';
            } else {
                const ul = document.createElement('ul');
                ul.className = 'history-list';
                history.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `<span class="date">${item.date || 'Попытка #' + (index + 1)}</span><span class="score-val">${item.score ?? 0} баллов</span>`;
                    ul.appendChild(li);
                });
                childHistoryEl.innerHTML = '';
                childHistoryEl.appendChild(ul);
            }
        }, (err) => {
            console.error("Snapshot error: ", err);
            groupCode.classList.add('has-error');
            errorText.style.display = 'block';
            errorText.textContent = 'Ошибка подключения к базе';
        });
    }

    codeForm.addEventListener('submit', (e) => {
        e.preventDefault();
        searchProgress(inputCode.value);
    });

    const resetCodeAction = (e) => {
        if (e) e.preventDefault();
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        localStorage.removeItem('jolBilimParentCode');
        progressCard.style.display = 'none';
        formCard.style.display = 'flex';
        inputCode.value = '';
        prevScore = null; prevTests = null;
        if (window.history && window.history.replaceState) {
            const cleanUrl = window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
        }
    };

    if (btnChangeCode) btnChangeCode.addEventListener('click', resetCodeAction);
    if (linkChangeCode) linkChangeCode.addEventListener('click', resetCodeAction);

    // При загрузке страницы проверяем URL и localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    const savedCode = localStorage.getItem('jolBilimParentCode');
    const initialCode = urlCode || savedCode;

    if (initialCode) {
        inputCode.value = initialCode;
        searchProgress(initialCode);
    }
});
</script>
</body>
</html>
